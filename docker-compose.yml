services:
  camera-sync:
    build: .
    image: tapo-camera-sync
    container_name: tapo-camera-sync
    restart: unless-stopped
    env_file: .env
    environment:
      # always write inside the mounted volume, whatever TAPO_OUTPUT says in .env
      TAPO_OUTPUT: /data
      # the web viewer listens on every interface inside the container; published below
      TAPO_WEB_HOST: 0.0.0.0
    ports:
      - "${TAPO_WEB_PORT:-8080}:${TAPO_WEB_PORT:-8080}"
    volumes:
      - ./camera_data:/data
